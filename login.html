<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş — Kitaptan Sınav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #232C1F;
    --paper: #EFE8D8;
    --paper-raised: #F8F4E9;
    --gold: #A9791F;
    --gold-deep: #7E5B16;
    --line: #CBC0A0;
    --rust: #A13F2B;
    --rust-bg: #F3E2DC;
    --ink-soft: #5B6152;
    --shadow: rgba(35, 44, 31, 0.16);
    --font-display: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ECE6D6;
      --paper: #1B1F16;
      --paper-raised: #242A1D;
      --gold: #D3A63E;
      --gold-deep: #E8C26A;
      --line: #40462F;
      --rust: #E08267;
      --rust-bg: #3A241E;
      --ink-soft: #A9A88E;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 36px;
    box-shadow: 0 1px 0 var(--shadow);
  }
  .kicker {
    font-size: 13px;
    font-weight: 600;
    color: var(--gold-deep);
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 26px;
    margin: 4px 0 26px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--ink-soft);
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
  }
  .field input:focus { outline: none; border-color: var(--gold); }
  button {
    width: 100%;
    padding: 14px 20px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 4px;
    font-family: var(--font-ui);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
  }
  @media (prefers-color-scheme: dark) {
    button { background: var(--gold); color: #1B1F16; }
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error-box {
    background: var(--rust-bg);
    border: 1px solid color-mix(in srgb, var(--rust) 40%, transparent);
    color: var(--rust);
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 13.5px;
    margin-top: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">KİTAPTAN SINAV</div>
    <h1>Giriş yap</h1>
    <form id="loginForm">
      <div class="field">
        <label for="username">Kullanıcı adı</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Şifre</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="submitBtn">Giriş yap</button>
    </form>
    <div id="errorBox"></div>
  </div>

<script>
const form = document.getElementById('loginForm');
const btn = document.getElementById('submitBtn');
const errorBox = document.getElementById('errorBox');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.innerHTML = '';
  btn.disabled = true;
  btn.textContent = 'Kontrol ediliyor…';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (res.ok) {
      window.location.href = '/';
    } else {
      errorBox.innerHTML = `<div class="error-box">${data.error || 'Giriş başarısız.'}</div>`;
    }
  } catch (err) {
    errorBox.innerHTML = `<div class="error-box">Bağlantı hatası: ${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Giriş yap';
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Kitaptan Sınav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --ink: #232C1F;
    --paper: #EFE8D8;
    --paper-raised: #F8F4E9;
    --gold: #A9791F;
    --gold-deep: #7E5B16;
    --line: #CBC0A0;
    --moss: #4C7A45;
    --moss-bg: #E4ECDD;
    --rust: #A13F2B;
    --rust-bg: #F3E2DC;
    --ink-soft: #5B6152;
    --shadow: rgba(35, 44, 31, 0.16);
    --font-display: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ink: #ECE6D6;
      --paper: #1B1F16;
      --paper-raised: #242A1D;
      --gold: #D3A63E;
      --gold-deep: #E8C26A;
      --line: #40462F;
      --moss: #8FBF7F;
      --moss-bg: #263420;
      --rust: #E08267;
      --rust-bg: #3A241E;
      --ink-soft: #A9A88E;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --ink: #ECE6D6;
    --paper: #1B1F16;
    --paper-raised: #242A1D;
    --gold: #D3A63E;
    --gold-deep: #E8C26A;
    --line: #40462F;
    --moss: #8FBF7F;
    --moss-bg: #263420;
    --rust: #E08267;
    --rust-bg: #3A241E;
    --ink-soft: #A9A88E;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    min-height: 100vh;
    padding: 48px 20px 80px;
    background-image:
      radial-gradient(circle at 15% 8%, color-mix(in srgb, var(--gold) 6%, transparent) 0%, transparent 45%),
      radial-gradient(circle at 85% 92%, color-mix(in srgb, var(--moss) 8%, transparent) 0%, transparent 50%);
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  .masthead { margin-bottom: 36px; }
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .masthead .kicker {
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    color: var(--gold-deep);
    letter-spacing: 0.02em;
  }
  .logout-link {
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    margin-top: 2px;
  }
  .masthead h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 34px;
    line-height: 1.15;
    margin: 4px 0 0;
    letter-spacing: -0.01em;
  }

  .steps {
    display: flex;
    gap: 6px;
    margin-bottom: 32px;
  }
  .steps .seg {
    flex: 1;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .steps .seg .fill {
    height: 100%;
    width: 0%;
    background: var(--gold);
    transition: width 0.4s ease;
  }
  .steps .seg.done .fill { width: 100%; }
  .steps .seg.active .fill { width: 50%; }

  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 36px;
    box-shadow: 0 1px 0 var(--shadow);
  }

  .dropzone {
    border: 1.5px dashed var(--line);
    border-radius: 4px;
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .dropzone:hover, .dropzone.drag {
    border-color: var(--gold);
    background: color-mix(in srgb, var(--gold) 6%, transparent);
  }
  .dropzone .glyph {
    font-family: var(--font-display);
    font-size: 32px;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .dropzone p { margin: 0; font-size: 15px; color: var(--ink-soft); }
  .dropzone .cta { color: var(--ink); font-weight: 600; }
  input[type="file"] { display: none; }

  .file-chip {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
  }
  .file-chip .icon { font-size: 20px; }
  .file-chip .meta { flex: 1; min-width: 0; }
  .file-chip .name {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-chip .sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .file-chip button {
    border: none;
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 13px;
    text-decoration: underline;
  }

  h2.section-title {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  p.section-sub {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 22px;
    line-height: 1.5;
  }

  .field { margin-bottom: 22px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--ink-soft);
  }
  .pill-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    padding: 9px 16px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--paper);
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .pill.selected {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  :root[data-theme="dark"] .pill.selected,
  :root:not([data-theme="light"]) .pill.selected {
    @media (prefers-color-scheme: dark) {
      background: var(--gold);
      color: #1B1F16;
      border-color: var(--gold);
    }
  }

  .btn-primary {
    width: 100%;
    padding: 15px 20px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 4px;
    font-family: var(--font-ui);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  :root[data-theme="dark"] .btn-primary,
  :root:not([data-theme="light"]) .btn-primary {
    @media (prefers-color-scheme: dark) {
      background: var(--gold);
      color: #1B1F16;
    }
  }

  .btn-ghost {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 12px 18px;
    border-radius: 4px;
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-ghost:hover { border-color: var(--gold); }

  .error-box {
    background: var(--rust-bg);
    border: 1px solid color-mix(in srgb, var(--rust) 40%, transparent);
    color: var(--rust);
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 13.5px;
    margin-top: 16px;
  }

  .loading-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 0 4px;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--line);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .quiz-progress {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 18px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .quiz-progress .num { font-weight: 700; color: var(--ink); font-family: var(--font-display); font-size: 15px; }

  .q-type-tag {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--gold-deep);
    background: color-mix(in srgb, var(--gold) 14%, transparent);
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 14px;
  }

  .q-text {
    font-family: var(--font-display);
    font-size: 21px;
    line-height: 1.4;
    margin: 0 0 24px;
    font-weight: 600;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 16px;
    border: 1px solid var(--line);
    border-radius: 4px;
    margin-bottom: 10px;
    cursor: pointer;
    font-size: 15px;
    line-height: 1.45;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:hover { border-color: var(--gold); }
  .option .letter {
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--gold-deep);
    flex-shrink: 0;
  }
  .option.selected { border-color: var(--ink); background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .option.correct { border-color: var(--moss); background: var(--moss-bg); }
  .option.wrong { border-color: var(--rust); background: var(--rust-bg); }

  textarea.open-answer {
    width: 100%;
    min-height: 110px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    padding: 14px;
    resize: vertical;
  }
  textarea.open-answer:focus { outline: none; border-color: var(--gold); }

  .feedback-box {
    margin-top: 18px;
    padding: 16px 18px;
    border-radius: 4px;
    border: 1px solid var(--line);
  }
  .feedback-box.correct { border-color: var(--moss); background: var(--moss-bg); }
  .feedback-box.wrong { border-color: var(--rust); background: var(--rust-bg); }
  .feedback-box .verdict {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .feedback-box.correct .verdict { color: var(--moss); }
  .feedback-box.wrong .verdict { color: var(--rust); }
  .feedback-box .explain { font-size: 14px; line-height: 1.55; color: var(--ink); }
  .feedback-box .model-answer {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .feedback-box .model-answer b { color: var(--ink); }

  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
  }
  .nav-row .btn-primary { width: auto; padding: 12px 28px; }

  .results-score {
    text-align: center;
    padding: 12px 0 28px;
  }
  .results-score .big {
    font-family: var(--font-display);
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
  }
  .results-score .lbl { font-size: 14px; color: var(--ink-soft); margin-top: 6px; }

  .review-item {
    border-top: 1px solid var(--line);
    padding: 16px 0;
  }
  .review-item .r-q { font-family: var(--font-display); font-weight: 600; font-size: 15.5px; margin-bottom: 6px; }
  .review-item .r-status { font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .review-item .r-status.correct { color: var(--moss); }
  .review-item .r-status.wrong { color: var(--rust); }
  .review-item .r-detail { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }
  .review-item .r-detail b { color: var(--ink); }

  .footer-actions { display: flex; gap: 10px; margin-top: 8px; }
  .footer-actions .btn-ghost, .footer-actions .btn-primary { flex: 1; }

  @media (max-width: 480px) {
    .card { padding: 24px 20px; }
    .masthead h1 { font-size: 27px; }
    .q-text { font-size: 18px; }
    .results-score .big { font-size: 44px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <div class="kicker">ADMİN PANELİ</div>
      <h1>Sınav Hazırla</h1>
    </div>
    <button class="logout-link" id="logoutBtn">Çıkış yap</button>
  </div>
  <div class="steps">
    <div class="seg" id="seg1"><div class="fill"></div></div>
    <div class="seg" id="seg2"><div class="fill"></div></div>
    <div class="seg" id="seg3"><div class="fill"></div></div>
  </div>
  <div id="app"></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const state = {
  screen: 'upload', // upload | settings | generating | saved
  fileName: null,
  pageCount: 0,
  extractedText: '',
  numQuestions: 8,
  questions: [],
  error: null,
  extracting: false,
  saving: false,
};

function setSteps() {
  const map = { upload: 1, settings: 1, generating: 2, saved: 3 };
  const active = map[state.screen] || 1;
  for (let i = 1; i <= 3; i++) {
    const el = document.getElementById('seg' + i);
    el.classList.remove('done', 'active');
    if (i < active) el.classList.add('done');
    else if (i === active) el.classList.add('active');
  }
}

async function extractPdfText(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  state.pageCount = pdf.numPages;
  let full = '';
  const maxPages = Math.min(pdf.numPages, 120);
  for (let i = 1; i <= maxPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const pageText = content.items.map(it => it.str).join(' ');
    full += pageText + '\n\n';
    if (full.length > 60000) break;
  }
  return full.trim();
}

function handleFile(file) {
  if (!file || file.type !== 'application/pdf') {
    state.error = 'Lütfen bir PDF dosyası seçin.';
    render();
    return;
  }
  state.fileName = file.name;
  state.error = null;
  state.extracting = true;
  render();
  extractPdfText(file).then(text => {
    if (!text || text.length < 200) {
      state.error = 'Bu PDF\'den metin çıkarılamadı. Taranmış (görüntü) bir PDF olabilir.';
      state.fileName = null;
      state.extracting = false;
      render();
      return;
    }
    state.extractedText = text;
    state.extracting = false;
    state.screen = 'settings';
    render();
  }).catch(err => {
    state.error = 'PDF okunurken bir sorun oluştu: ' + err.message;
    state.extracting = false;
    render();
  });
}

async function generateQuiz() {
  state.screen = 'generating';
  state.error = null;
  render();

  const n = state.numQuestions;

  try {
    const res = await fetch('/api/generate-quiz', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: state.extractedText.slice(0, 45000),
        numQuestions: n
      })
    });

    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      throw new Error(errBody.error || ('Sunucu hatası (' + res.status + ')'));
    }

    const data = await res.json();
    const qs = (data && data.questions) ? data.questions : (Array.isArray(data) ? data : null);
    if (!qs || !qs.length) throw new Error('Beklenmeyen yanıt biçimi');

    state.questions = qs;

    // Sorular üretildi, şimdi çocuğun görebilmesi için ortak depoya kaydet.
    const saveRes = await fetch('/api/save-quiz', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        questions: qs,
        sourceFileName: state.fileName
      })
    });
    if (!saveRes.ok) {
      const errBody = await saveRes.json().catch(() => ({}));
      throw new Error(errBody.error || 'Sınav kaydedilemedi.');
    }

    state.screen = 'saved';
    render();
  } catch (err) {
    state.error = 'Sorular üretilirken bir sorun oluştu: ' + (err.message || 'bilinmeyen hata');
    state.screen = 'settings';
    render();
  }
}

function restart() {
  state.screen = 'upload';
  state.fileName = null;
  state.extractedText = '';
  state.questions = [];
  state.error = null;
  render();
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function render() {
  setSteps();
  const app = document.getElementById('app');

  if (state.screen === 'upload') {
    app.innerHTML = `
      <div class="card">
        <h2 class="section-title">Ders kitabını yükle</h2>
        <p class="section-sub">PDF formatındaki ders kitabını veya bölümünü yükle, içeriğe göre karışık sorular hazırlayalım.</p>
        ${state.extracting ? `
          <div class="loading-row"><div class="spinner"></div> "${esc(state.fileName)}" okunuyor…</div>
        ` : `
          <div class="dropzone" id="dropzone">
            <div class="glyph">⤒</div>
            <p><span class="cta">Dosya seç</span> ya da buraya sürükle bırak</p>
          </div>
          <input type="file" id="fileInput" accept="application/pdf">
        `}
        ${state.error ? `<div class="error-box">${esc(state.error)}</div>` : ''}
      </div>
    `;
    if (!state.extracting) {
      const dz = document.getElementById('dropzone');
      const fi = document.getElementById('fileInput');
      dz.addEventListener('click', () => fi.click());
      dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
      dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
      dz.addEventListener('drop', e => {
        e.preventDefault();
        dz.classList.remove('drag');
        if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
      });
      fi.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
    }
    return;
  }

  if (state.screen === 'settings') {
    const opts = [5, 8, 12, 16];
    app.innerHTML = `
      <div class="card">
        <h2 class="section-title">Sınavı ayarla</h2>
        <p class="section-sub">${state.pageCount ? state.pageCount + ' sayfalık kitaptan, ' : ''}çoktan seçmeli ve açık uçlu karışık sorular üretilecek.</p>

        <div class="file-chip" style="margin-bottom:24px;">
          <span class="icon">📄</span>
          <div class="meta">
            <div class="name">${esc(state.fileName)}</div>
            <div class="sub">${state.pageCount} sayfa okundu</div>
          </div>
          <button id="changeFile">değiştir</button>
        </div>

        <div class="field">
          <label>Soru sayısı</label>
          <div class="pill-group" id="qCountGroup">
            ${opts.map(n => `<button class="pill ${state.numQuestions === n ? 'selected' : ''}" data-n="${n}">${n} soru</button>`).join('')}
          </div>
        </div>

        <button class="btn-primary" id="genBtn">Soruları hazırla</button>
        ${state.error ? `<div class="error-box">${esc(state.error)}</div>` : ''}
      </div>
    `;
    document.getElementById('changeFile').addEventListener('click', restart);
    document.getElementById('genBtn').addEventListener('click', generateQuiz);
    document.querySelectorAll('#qCountGroup .pill').forEach(btn => {
      btn.addEventListener('click', () => {
        state.numQuestions = parseInt(btn.dataset.n, 10);
        render();
      });
    });
    return;
  }

  if (state.screen === 'generating') {
    app.innerHTML = `
      <div class="card">
        <h2 class="section-title">Sorular hazırlanıyor</h2>
        <p class="section-sub">Kitaptaki içerik taranıp ${state.numQuestions} soruluk karışık bir sınav oluşturuluyor, ardından çocuğunuz için kaydediliyor. Bu biraz zaman alabilir.</p>
        <div class="loading-row"><div class="spinner"></div> Lütfen bekleyin…</div>
        ${state.error ? `<div class="error-box">${esc(state.error)}</div>` : ''}
      </div>
    `;
    return;
  }

  if (state.screen === 'saved') {
    app.innerHTML = `
      <div class="card">
        <div class="results-score">
          <div class="big">✓</div>
          <div class="lbl">${state.questions.length} soruluk sınav hazır ve kaydedildi</div>
        </div>
        <p class="section-sub" style="text-align:center;">Çocuğunuz kendi hesabıyla giriş yaptığında bu sınavı görecek.</p>
        <div class="footer-actions">
          <button class="btn-primary" id="newBookBtn">Yeni bir kitap yükle</button>
        </div>
      </div>
    `;
    document.getElementById('newBookBtn').addEventListener('click', restart);
    return;
  }
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  fetch('/api/logout', { method: 'POST' }).finally(() => {
    window.location.href = '/login.html';
  });
});

render();
</script>
</body>
</html>

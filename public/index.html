<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitaptan Sınav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #232C1F;
    --paper: #EFE8D8;
    --paper-raised: #F8F4E9;
    --gold: #A9791F;
    --gold-deep: #7E5B16;
    --line: #CBC0A0;
    --moss: #4C7A45;
    --moss-bg: #E4ECDD;
    --rust: #A13F2B;
    --rust-bg: #F3E2DC;
    --ink-soft: #5B6152;
    --shadow: rgba(35, 44, 31, 0.16);
    --font-display: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ink: #ECE6D6;
      --paper: #1B1F16;
      --paper-raised: #242A1D;
      --gold: #D3A63E;
      --gold-deep: #E8C26A;
      --line: #40462F;
      --moss: #8FBF7F;
      --moss-bg: #263420;
      --rust: #E08267;
      --rust-bg: #3A241E;
      --ink-soft: #A9A88E;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --ink: #ECE6D6;
    --paper: #1B1F16;
    --paper-raised: #242A1D;
    --gold: #D3A63E;
    --gold-deep: #E8C26A;
    --line: #40462F;
    --moss: #8FBF7F;
    --moss-bg: #263420;
    --rust: #E08267;
    --rust-bg: #3A241E;
    --ink-soft: #A9A88E;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    min-height: 100vh;
    padding: 48px 20px 80px;
    background-image:
      radial-gradient(circle at 15% 8%, color-mix(in srgb, var(--gold) 6%, transparent) 0%, transparent 45%),
      radial-gradient(circle at 85% 92%, color-mix(in srgb, var(--moss) 8%, transparent) 0%, transparent 50%);
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  .masthead { margin-bottom: 36px; }
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .masthead .kicker {
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    color: var(--gold-deep);
    letter-spacing: 0.02em;
  }
  .logout-link {
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    margin-top: 2px;
  }
  .masthead h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 34px;
    line-height: 1.15;
    margin: 4px 0 0;
    letter-spacing: -0.01em;
  }

  .steps {
    display: flex;
    gap: 6px;
    margin-bottom: 32px;
  }
  .steps .seg {
    flex: 1;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .steps .seg .fill {
    height: 100%;
    width: 0%;
    background: var(--gold);
    transition: width 0.4s ease;
  }
  .steps .seg.done .fill { width: 100%; }
  .steps .seg.active .fill { width: 50%; }

  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 36px;
    box-shadow: 0 1px 0 var(--shadow);
  }

  .dropzone {
    border: 1.5px dashed var(--line);
    border-radius: 4px;
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .dropzone:hover, .dropzone.drag {
    border-color: var(--gold);
    background: color-mix(in srgb, var(--gold) 6%, transparent);
  }
  .dropzone .glyph {
    font-family: var(--font-display);
    font-size: 32px;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .dropzone p { margin: 0; font-size: 15px; color: var(--ink-soft); }
  .dropzone .cta { color: var(--ink); font-weight: 600; }
  input[type="file"] { display: none; }

  .file-chip {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
  }
  .file-chip .icon { font-size: 20px; }
  .file-chip .meta { flex: 1; min-width: 0; }
  .file-chip .name {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-chip .sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .file-chip button {
    border: none;
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 13px;
    text-decoration: underline;
  }

  h2.section-title {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  p.section-sub {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 22px;
    line-height: 1.5;
  }

  .field { margin-bottom: 22px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--ink-soft);
  }
  .pill-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    padding: 9px 16px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--paper);
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .pill.selected {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  :root[data-theme="dark"] .pill.selected,
  :root:not([data-theme="light"]) .pill.selected {
    @media (prefers-color-scheme: dark) {
      background: var(--gold);
      color: #1B1F16;
      border-color: var(--gold);
    }
  }

  .btn-primary {
    width: 100%;
    padding: 15px 20px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 4px;
    font-family: var(--font-ui);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  :root[data-theme="dark"] .btn-primary,
  :root:not([data-theme="light"]) .btn-primary {
    @media (prefers-color-scheme: dark) {
      background: var(--gold);
      color: #1B1F16;
    }
  }

  .btn-ghost {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 12px 18px;
    border-radius: 4px;
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-ghost:hover { border-color: var(--gold); }

  .error-box {
    background: var(--rust-bg);
    border: 1px solid color-mix(in srgb, var(--rust) 40%, transparent);
    color: var(--rust);
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 13.5px;
    margin-top: 16px;
  }

  .loading-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 0 4px;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--line);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .quiz-progress {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 18px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .quiz-progress .num { font-weight: 700; color: var(--ink); font-family: var(--font-display); font-size: 15px; }

  .q-type-tag {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--gold-deep);
    background: color-mix(in srgb, var(--gold) 14%, transparent);
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 14px;
  }

  .q-text {
    font-family: var(--font-display);
    font-size: 21px;
    line-height: 1.4;
    margin: 0 0 24px;
    font-weight: 600;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 16px;
    border: 1px solid var(--line);
    border-radius: 4px;
    margin-bottom: 10px;
    cursor: pointer;
    font-size: 15px;
    line-height: 1.45;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:hover { border-color: var(--gold); }
  .option .letter {
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--gold-deep);
    flex-shrink: 0;
  }
  .option.selected { border-color: var(--ink); background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .option.correct { border-color: var(--moss); background: var(--moss-bg); }
  .option.wrong { border-color: var(--rust); background: var(--rust-bg); }

  textarea.open-answer {
    width: 100%;
    min-height: 110px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    padding: 14px;
    resize: vertical;
  }
  textarea.open-answer:focus { outline: none; border-color: var(--gold); }

  .feedback-box {
    margin-top: 18px;
    padding: 16px 18px;
    border-radius: 4px;
    border: 1px solid var(--line);
  }
  .feedback-box.correct { border-color: var(--moss); background: var(--moss-bg); }
  .feedback-box.wrong { border-color: var(--rust); background: var(--rust-bg); }
  .feedback-box .verdict {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .feedback-box.correct .verdict { color: var(--moss); }
  .feedback-box.wrong .verdict { color: var(--rust); }
  .feedback-box .explain { font-size: 14px; line-height: 1.55; color: var(--ink); }
  .feedback-box .model-answer {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .feedback-box .model-answer b { color: var(--ink); }

  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
  }
  .nav-row .btn-primary { width: auto; padding: 12px 28px; }

  .results-score {
    text-align: center;
    padding: 12px 0 28px;
  }
  .results-score .big {
    font-family: var(--font-display);
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
  }
  .results-score .lbl { font-size: 14px; color: var(--ink-soft); margin-top: 6px; }

  .review-item {
    border-top: 1px solid var(--line);
    padding: 16px 0;
  }
  .review-item .r-q { font-family: var(--font-display); font-weight: 600; font-size: 15.5px; margin-bottom: 6px; }
  .review-item .r-status { font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .review-item .r-status.correct { color: var(--moss); }
  .review-item .r-status.wrong { color: var(--rust); }
  .review-item .r-detail { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }
  .review-item .r-detail b { color: var(--ink); }

  .footer-actions { display: flex; gap: 10px; margin-top: 8px; }
  .footer-actions .btn-ghost, .footer-actions .btn-primary { flex: 1; }

  @media (max-width: 480px) {
    .card { padding: 24px 20px; }
    .masthead h1 { font-size: 27px; }
    .q-text { font-size: 18px; }
    .results-score .big { font-size: 44px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <div class="kicker">DERS KİTABINDAN</div>
      <h1>Kitaptan Sınav</h1>
    </div>
    <button class="logout-link" id="logoutBtn">Çıkış yap</button>
  </div>
  <div id="app"></div>
</div>

<script>
const state = {
  screen: 'loading', // loading | empty | quiz | results | error
  questions: [],
  current: 0,
  answers: [],
  error: null,
  sourceFileName: null,
};

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

async function loadQuiz() {
  state.screen = 'loading';
  render();
  try {
    const res = await fetch('/api/get-quiz');
    if (res.status === 404) {
      state.screen = 'empty';
      render();
      return;
    }
    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      throw new Error(errBody.error || ('Sunucu hatası (' + res.status + ')'));
    }
    const data = await res.json();
    const qs = data.questions || [];
    if (!qs.length) {
      state.screen = 'empty';
      render();
      return;
    }
    state.questions = qs;
    state.sourceFileName = data.sourceFileName || null;
    state.answers = qs.map(() => ({ selected: null, text: '', checked: false, correct: null }));
    state.current = 0;
    state.screen = 'quiz';
    render();
  } catch (err) {
    state.error = err.message || 'Sınav yüklenirken bir sorun oluştu.';
    state.screen = 'error';
    render();
  }
}

function selectOption(qIndex, optIndex) {
  const ans = state.answers[qIndex];
  if (ans.checked) return;
  ans.selected = optIndex;
  render();
}

function checkAnswer(qIndex) {
  const q = state.questions[qIndex];
  const ans = state.answers[qIndex];
  if (q.type === 'coktan_secmeli') {
    if (ans.selected === null) return;
    ans.checked = true;
    ans.correct = ans.selected === q.correctIndex;
  } else {
    if (!ans.text || !ans.text.trim()) return;
    ans.checked = true;
    ans.correct = null;
  }
  render();
}

function nextQuestion() {
  if (state.current < state.questions.length - 1) {
    state.current++;
    render();
  } else {
    state.screen = 'results';
    render();
  }
}

function prevQuestion() {
  if (state.current > 0) {
    state.current--;
    render();
  }
}

function restartSameQuiz() {
  state.answers = state.questions.map(() => ({ selected: null, text: '', checked: false, correct: null }));
  state.current = 0;
  state.screen = 'quiz';
  render();
}

function render() {
  const app = document.getElementById('app');

  if (state.screen === 'loading') {
    app.innerHTML = `
      <div class="card">
        <div class="loading-row"><div class="spinner"></div> Sınavın yükleniyor…</div>
      </div>
    `;
    return;
  }

  if (state.screen === 'empty') {
    app.innerHTML = `
      <div class="card">
        <h2 class="section-title">Henüz bir sınav yok</h2>
        <p class="section-sub">Ebeveyninizin bir ders kitabı yükleyip sınav hazırlamasını bekleyin. Hazır olduğunda burada görünecek.</p>
        <button class="btn-ghost" id="retryBtn">Tekrar kontrol et</button>
      </div>
    `;
    document.getElementById('retryBtn').addEventListener('click', loadQuiz);
    return;
  }

  if (state.screen === 'error') {
    app.innerHTML = `
      <div class="card">
        <h2 class="section-title">Bir sorun oluştu</h2>
        <div class="error-box">${esc(state.error)}</div>
        <button class="btn-ghost" id="retryBtn" style="margin-top:16px;">Tekrar dene</button>
      </div>
    `;
    document.getElementById('retryBtn').addEventListener('click', loadQuiz);
    return;
  }

  if (state.screen === 'quiz') {
    const q = state.questions[state.current];
    const ans = state.answers[state.current];
    const isLast = state.current === state.questions.length - 1;
    const typeLabel = q.type === 'coktan_secmeli' ? 'Çoktan Seçmeli' : 'Açık Uçlu';

    let bodyHtml = '';
    if (q.type === 'coktan_secmeli') {
      bodyHtml = (q.options || []).map((opt, i) => {
        let cls = 'option';
        if (ans.checked) {
          if (i === q.correctIndex) cls += ' correct';
          else if (i === ans.selected) cls += ' wrong';
        } else if (ans.selected === i) {
          cls += ' selected';
        }
        const letter = String.fromCharCode(65 + i);
        return `<div class="${cls}" data-opt="${i}"><span class="letter">${letter}</span><span>${esc(opt)}</span></div>`;
      }).join('');
    } else {
      bodyHtml = `<textarea class="open-answer" id="openAnswer" placeholder="Cevabını buraya yaz…" ${ans.checked ? 'readonly' : ''}>${esc(ans.text)}</textarea>`;
    }

    let feedbackHtml = '';
    if (ans.checked) {
      if (q.type === 'coktan_secmeli') {
        const cls = ans.correct ? 'correct' : 'wrong';
        feedbackHtml = `
          <div class="feedback-box ${cls}">
            <div class="verdict">${ans.correct ? 'Doğru' : 'Yanlış'}</div>
            <div class="explain">${esc(q.explanation || '')}</div>
          </div>
        `;
      } else {
        feedbackHtml = `
          <div class="feedback-box correct">
            <div class="verdict">Cevabın kaydedildi</div>
            <div class="explain">${esc(q.evaluationNote || '')}</div>
            <div class="model-answer"><b>Model cevap:</b> ${esc(q.modelAnswer || '')}</div>
          </div>
        `;
      }
    }

    const canCheck = q.type === 'coktan_secmeli' ? ans.selected !== null : true;

    app.innerHTML = `
      <div class="card">
        <div class="quiz-progress">
          <span><span class="num">${state.current + 1}</span> / ${state.questions.length}</span>
        </div>
        <div class="q-type-tag">${typeLabel}</div>
        <div class="q-text">${esc(q.question)}</div>
        <div id="qBody">${bodyHtml}</div>
        ${feedbackHtml}
        <div class="nav-row">
          <button class="btn-ghost" id="prevBtn" ${state.current === 0 ? 'disabled style="visibility:hidden"' : ''}>Geri</button>
          ${!ans.checked
            ? `<button class="btn-primary" id="checkBtn" ${canCheck ? '' : 'disabled'}>Cevapla</button>`
            : `<button class="btn-primary" id="nextBtn">${isLast ? 'Bitir' : 'Sonraki soru'}</button>`
          }
        </div>
      </div>
    `;

    if (q.type === 'coktan_secmeli') {
      document.querySelectorAll('#qBody .option').forEach(el => {
        el.addEventListener('click', () => selectOption(state.current, parseInt(el.dataset.opt, 10)));
      });
    } else {
      const ta = document.getElementById('openAnswer');
      if (ta && !ans.checked) {
        ta.addEventListener('input', e => { ans.text = e.target.value; });
      }
    }
    const prevBtn = document.getElementById('prevBtn');
    if (prevBtn) prevBtn.addEventListener('click', prevQuestion);
    const checkBtn = document.getElementById('checkBtn');
    if (checkBtn) checkBtn.addEventListener('click', () => checkAnswer(state.current));
    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn) nextBtn.addEventListener('click', nextQuestion);
    return;
  }

  if (state.screen === 'results') {
    const mcQuestions = state.questions.filter(q => q.type === 'coktan_secmeli');
    const mcCorrect = state.answers.filter((a, i) => state.questions[i].type === 'coktan_secmeli' && a.correct).length;
    const openCount = state.questions.length - mcQuestions.length;

    const reviewHtml = state.questions.map((q, i) => {
      const a = state.answers[i];
      if (q.type === 'coktan_secmeli') {
        return `
          <div class="review-item">
            <div class="r-q">${i + 1}. ${esc(q.question)}</div>
            <div class="r-status ${a.correct ? 'correct' : 'wrong'}">${a.correct ? 'DOĞRU' : 'YANLIŞ'}</div>
            <div class="r-detail">
              <b>Senin cevabın:</b> ${esc(q.options[a.selected])}<br>
              ${!a.correct ? `<b>Doğru cevap:</b> ${esc(q.options[q.correctIndex])}<br>` : ''}
              ${esc(q.explanation || '')}
            </div>
          </div>
        `;
      }
      return `
        <div class="review-item">
          <div class="r-q">${i + 1}. ${esc(q.question)}</div>
          <div class="r-status correct">CEVAPLANDI</div>
          <div class="r-detail">
            <b>Senin cevabın:</b> ${esc(a.text || '(boş bırakıldı)')}<br>
            <b>Model cevap:</b> ${esc(q.modelAnswer || '')}
          </div>
        </div>
      `;
    }).join('');

    app.innerHTML = `
      <div class="card">
        <div class="results-score">
          <div class="big">${mcCorrect}/${mcQuestions.length}</div>
          <div class="lbl">çoktan seçmeli doğru ${openCount ? '· ' + openCount + ' açık uçlu soru cevaplandı' : ''}</div>
        </div>
        <div class="footer-actions">
          <button class="btn-primary" id="retakeBtn">Sınavı yeniden çöz</button>
        </div>
        <div style="margin-top:28px;">
          ${reviewHtml}
        </div>
      </div>
    `;
    document.getElementById('retakeBtn').addEventListener('click', restartSameQuiz);
    return;
  }
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  fetch('/api/logout', { method: 'POST' }).finally(() => {
    window.location.href = '/login.html';
  });
});

loadQuiz();
</script>
